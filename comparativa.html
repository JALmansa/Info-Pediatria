<style>
  :root { --fondo: #f4f6f8; --tarjeta: #ffffff; --texto: #1d2733; --suave: #5b6b7c; --acento: #0b6e8a; --borde: #d5dde5; }
  @media (prefers-color-scheme: dark) { :root { --fondo: #10161c; --tarjeta: #1a232c; --texto: #e6edf3; --suave: #9fb0c0; --acento: #4cc2e0; --borde: #2c3a47; } }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto); line-height: 1.45; }

  figure { margin: 0 0 16px; background: #fff; border: 1px solid var(--borde); border-radius: 12px; padding: 8px; }
  figure a { display: block; }
  img { width: 100%; height: auto; display: block; }

<body>
<main>
  <p><a href="./">← Volver al buscador de dosis</a></p>
  <h1>Comparativa con series europeas</h1>
  <p>Comparación descriptiva: cada serie conserva sus grupos de edad, su protocolo y su estadístico (media o mediana). No es una clasificación de países ni un objetivo de dosis. En el móvil, toque la imagen para ampliarla.</p>

  </figure>
  <figure>
    <a href="img/comparativa-rx.png"><img src="img/comparativa-rx.png" alt="Gráfico comparativo de dosis efectiva en radiografía pediátrica de tórax y abdomen: España frente a una serie de Reino Unido."></a>
    <figcaption>Figura 2. Radiografía convencional.</figcaption>
  </figure>
</main>
